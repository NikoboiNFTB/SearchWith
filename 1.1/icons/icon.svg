<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000c1b"/>
      <stop offset="100%" stop-color="#0060d8"/>
    </linearGradient>
    <radialGradient id="circleGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#808080"/>
    </radialGradient>
    <mask id="glassMask">
      <rect width="400" height="400" fill="black"/>
      <circle cx="240" cy="160" r="100" fill="white"/>
      <circle cx="240" cy="160" r="70" fill="black"/>
      <rect x="170" y="250" width="30" height="150" rx="15" ry="15" transform="rotate(45 230 230)" fill="white"/>
    </mask>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#circleGradient)"/>
  <circle cx="200" cy="200" r="200" fill="url(#glassGradient)" mask="url(#glassMask)"/>
</svg>
